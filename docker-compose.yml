services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:main-slim@sha256:3d8a43e4e96fdfec4d96f774f3029eed821651370a330fce3fe4e27625440b73}
    pull_policy: always
    container_name: ai-static-check-fix-demo-openclaw
    restart: unless-stopped
    user: root
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18799}:${OPENCLAW_GATEWAY_PORT:-18799}"
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18799}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_PRIMARY_MODEL: ${OPENCLAW_PRIMARY_MODEL:-google/gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - openclaw_state:/home/node/.openclaw
      - .:/demo
    command: ["sh", "/demo/docker/bootstrap-openclaw.sh"]
  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:main-slim@sha256:3d8a43e4e96fdfec4d96f774f3029eed821651370a330fce3fe4e27625440b73}
    pull_policy: always
    profiles:
      - cli
    user: root
    working_dir: /demo
    network_mode: "service:openclaw-gateway"
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18799}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_PRIMARY_MODEL: ${OPENCLAW_PRIMARY_MODEL:-google/gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - openclaw_state:/home/node/.openclaw
      - .:/demo
    entrypoint: ["openclaw"]

volumes:
  openclaw_state:
